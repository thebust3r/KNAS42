# Publishing a new version: change VERSION in app/server.py (and the notes in .github/RELEASE_NOTES.md),
# push it, and GitHub does the rest (it skips versions that already have a release):
#   1. builds the update zip (KNAS-<version>-update.zip, for the updates folder)
#   2. builds the KNAS 42 Android app (KNAS-42-<version>.apk), signed with the key in the repo's secrets
#   3. publishes a release with both attached, using .github/RELEASE_NOTES.md as the notes
name: Release

on:
  push:
    branches: [main, master]
    paths: ["app/server.py", ".github/RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this a new version?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/server.py | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version already has a release, nothing to do"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          echo "version=${{ needs.check.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${{ needs.check.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Make the update zip
        run: |
          mkdir -p pkg out
          git archive --format=tar HEAD | tar -x -C pkg
          rm -rf pkg/android pkg/.github pkg/tizen pkg/signing pkg/package.json pkg/installers pkg/xbox pkg/windows
          (cd pkg && zip -qr "../out/KNAS-${{ steps.v.outputs.version }}-update.zip" .)
          python3 -m py_compile pkg/server.py pkg/app/*.py
          cp installers/Install-KNAS-Windows.bat installers/install-knas.sh out/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Get the signing key
        env:
          KS_B64: ${{ secrets.KNAS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KNAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/knas.jks"
            echo "KNAS_KEYSTORE=$RUNNER_TEMP/knas.jks" >> "$GITHUB_ENV"
            echo "KNAS_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signing with the KNAS key"
          else
            echo "::error::The signing key isn't in the repo secrets (KNAS_KEYSTORE_B64, KNAS_KEYSTORE_PASSWORD)."
            exit 1
          fi

      - name: Build the Android app
        run: |
          gradle -p android assembleRelease -PknasVersion=${{ steps.v.outputs.version }} --no-daemon
          cp android/app/build/outputs/apk/release/*.apk "out/KNAS-42-${{ steps.v.outputs.version }}.apk"
          keytool -printcert -jarfile out/*.apk | grep -i "owner" || true
          ls -la out

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Samsung TV app: tizen/ signed with the app's author certificate (signing/tizen-author.p12, kept in the
      # repo so every version installs over the last) using tizen.js, by the TizenBrew author. No Tizen Studio needed.
      - name: Build the Samsung TV app
        run: |
          git clone --depth 1 https://github.com/reisxd/tizen.js "$RUNNER_TEMP/tizenjs"
          (cd "$RUNNER_TEMP/tizenjs" && npm install --silent)
          # tizen.js bug fix: pack the author's own key into new certificates (not the issuing CA's)
          sed -i 's/toPkcs12Asn1(developerPrivateKey,/toPkcs12Asn1(key.privateKey,/' "$RUNNER_TEMP/tizenjs/src/tizenCertificateCreator.js"
          mkdir -p "$RUNNER_TEMP/tvapp"
          cp tizen/config.xml tizen/index.html tizen/app.js tizen/style.css tizen/icon.png "$RUNNER_TEMP/tvapp/"
          sed -i 's/\(<widget[^>]* version="\)[^"]*"/\1${{ steps.v.outputs.version }}"/' "$RUNNER_TEMP/tvapp/config.xml"
          grep -o '<widget[^>]*version="[^"]*"' "$RUNNER_TEMP/tvapp/config.xml"
          cd "$RUNNER_TEMP/tvapp"
          node "$RUNNER_TEMP/tizenjs/cli.js" build . -t wgt -o "$GITHUB_WORKSPACE/out/KNAS-42-Samsung-${{ steps.v.outputs.version }}.wgt" \
            --author "$GITHUB_WORKSPACE/signing/tizen-author.p12" --authorPwd knas42author -p public
          cd "$GITHUB_WORKSPACE" && unzip -l out/*.wgt
          pip install --quiet lxml cryptography
          python3 .github/scripts/verify-wgt-signature.py out/*.wgt      # stop if the TV would reject the signature

      # With a RELEASE_TOKEN secret (a token from your own GitHub account), the release shows as made by you.
      # If the token is missing or can't publish, it falls back to "github-actions" so the release still goes out.
      - name: Publish the release
        env:
          USER_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          publish() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" out/* --clobber
            else
              gh release create "$tag" out/* --target "$GITHUB_SHA" --title "KNAS ${{ steps.v.outputs.version }}" --notes-file .github/RELEASE_NOTES.md
            fi
          }
          if [ -n "$USER_TOKEN" ]; then
            perm="$(GH_TOKEN="$USER_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' 2>&1 || true)"
            echo "RELEASE_TOKEN check: $perm"
            if [ "$perm" = "true" ] && GH_TOKEN="$USER_TOKEN" publish 2> err.txt; then
              echo "Published as you"; exit 0
            fi
            echo "::warning::RELEASE_TOKEN couldn't publish the release (check: ${perm}; $(tr '\n' ' ' < err.txt 2>/dev/null | head -c 300)). It needs access to the knas42 repo with Contents: Read and write. Publishing as github-actions instead."
          fi
          GH_TOKEN="$BOT_TOKEN" publish
