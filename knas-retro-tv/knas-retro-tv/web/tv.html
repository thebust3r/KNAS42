<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KNAS Cable</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KNAS Cable">
<meta name="theme-color" content="#000000">
<style>
:root{--gold:#ffd23a;--gold2:#ffb000;--ice:#a9c4ff;--white:#fff;--navy:#0a1552;--panel-top:#2c55c8;--panel-bot:#112673;--edge:#9cb8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
/* the mouse pointer shows while you move a mouse (or TV pointer) and hides again after a few still seconds */
html.mouse,html.mouse body{cursor:default}html.mouse .cell,html.mouse .gr .gcn{cursor:pointer}
body{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff}
#video,#web,#static{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;background:#000}
#video{object-fit:contain}
body.stretch #video{object-fit:fill}
#web{display:none}
#static{image-rendering:pixelated;z-index:5;display:none}
#touch{position:fixed;top:0;right:0;bottom:0;left:0;z-index:8;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#guide{touch-action:none}
#stage{position:fixed;left:50%;top:50%;width:640px;height:480px;transform-origin:center;z-index:10;pointer-events:none}
.sh{text-shadow:2px 2px 0 #000,0 0 2px #000}

/* channel number, top right like a cable box */
#osd{position:absolute;right:26px;top:20px;font-size:64px;font-weight:800;font-style:italic;color:var(--gold);line-height:1;display:none;text-align:right}
#osd small{display:block;font-size:24px;font-style:normal;color:#fff;letter-spacing:1px}
#nosig{position:absolute;left:0;right:0;top:200px;text-align:center;font-size:40px;font-weight:800;letter-spacing:3px;display:none}
#hint{position:absolute;left:50%;top:auto;bottom:172px;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:20px;font-weight:800;color:var(--gold);background:rgba(4,10,50,.85);padding:3px 14px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge);display:none;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* banner */
#banner{position:absolute;left:18px;right:18px;bottom:18px;height:146px;border-radius:7px;display:none;
  background:linear-gradient(180deg,var(--panel-top),#1d3a9e 50%,var(--panel-bot));
  box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 5px var(--navy),4px 5px 0 rgba(0,0,0,.55)}
#banner.on{display:block;animation:up .35s cubic-bezier(.2,.8,.25,1) both;will-change:transform,opacity}
@keyframes up{from{opacity:0;transform:translate3d(0,40px,0)}to{opacity:1;transform:none}}
.b-num{position:absolute;left:14px;top:20px;width:104px;height:104px;border-radius:8px;text-align:center;
  background:linear-gradient(160deg,#5d8bff,#1d3db8 55%,#0b1a66);box-shadow:inset 0 0 0 3px #cfe0ff,inset 0 0 0 5px #0b1a66,3px 3px 0 #000}
.b-num b{display:block;font-size:56px;font-weight:800;font-style:italic;line-height:70px}
.b-num span{display:block;margin:0 8px;height:22px;line-height:22px;background:#e3261b;border-radius:2px;font-size:17px;font-weight:800;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;box-shadow:0 2px 0 #6a0d07}
.b-main{position:absolute;left:134px;right:16px;top:10px}
.b-title{font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-sub{font-size:22px;font-weight:700;color:var(--ice);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:26px}
.b-row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:22px;font-weight:700}
.b-bar{flex:1;height:12px;background:#0a1552;border-radius:2px;box-shadow:inset 0 0 0 2px #6f8de0;overflow:hidden}
.b-bar i{display:block;height:100%;background:linear-gradient(180deg,#ffd23a,#ff9a1a)}
.b-next{font-size:21px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-next b{color:var(--gold)}
.b-clock{position:absolute;right:16px;top:-34px;font-size:26px;font-weight:800}

/* guide */
#guide{position:absolute;left:0;right:0;bottom:0;top:0;display:none}
#guide.on{display:block}
#guide.on #gGrid{animation:gUp .45s cubic-bezier(.2,.8,.25,1) both}
#guide.on #gLogo{animation:gFade .5s cubic-bezier(.2,.8,.25,1) .1s both}
#guide.on #gInfo{animation:gFade .5s cubic-bezier(.2,.8,.25,1) .18s both}
@keyframes gUp{from{transform:translate3d(0,300px,0)}to{transform:none}}
@keyframes gFade{from{opacity:0;transform:translate3d(0,-14px,0)}to{opacity:1;transform:none}}
#gInfo .swap{animation:infoIn .35s cubic-bezier(.2,.8,.25,1) both}
@keyframes infoIn{from{opacity:0;transform:translate3d(14px,0,0)}to{opacity:1;transform:none}}
#gIn{position:absolute;left:0;right:0;top:0;transition:transform .32s cubic-bezier(.25,.8,.25,1);will-change:transform}
#gCur{position:absolute;left:0;top:0;height:49px;border-radius:4px;pointer-events:none;z-index:3;
  box-shadow:0 0 0 3px #fff,0 0 14px 3px rgba(255,210,58,.9);
  transition:transform .22s cubic-bezier(.25,.8,.25,1),width .22s cubic-bezier(.25,.8,.25,1);will-change:transform,width;animation:curGlow 1.6s ease-in-out infinite}
@keyframes curGlow{50%{opacity:.55}}
.cell .pr{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#ffd23a,#ff7a1a);opacity:.9}
.cell.sel .pr{background:#a0140c}
#gLogo .gl2{background:linear-gradient(180deg,#fff3b0,#ffd23a 45%,#ff9a1a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 #000)}
#gInfo{position:absolute;left:250px;right:14px;top:12px;height:158px;border-radius:7px;padding:10px 14px;overflow:hidden;
  background:rgba(8,18,80,.88);box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 5px var(--navy),4px 5px 0 rgba(0,0,0,.5)}
#gInfo .gt{font-size:30px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gInfo .gm{font-size:21px;font-weight:700;color:var(--gold);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gInfo .gd{font-size:20px;font-weight:600;line-height:1.15;color:#e4ebff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#gLogo{position:absolute;left:14px;top:12px;width:224px;height:158px;display:flex;flex-direction:column;justify-content:flex-end}
#gLogo .gl1{font-size:26px;font-weight:700;font-style:italic}
#gLogo .gl2{font-size:44px;font-weight:800;font-style:italic;color:var(--gold);line-height:.95}
#gLogo .gl3{font-size:24px;font-weight:800;margin-top:4px}
#gGrid{position:absolute;left:0;right:0;top:182px;bottom:0;background:linear-gradient(180deg,#0e2a8f,#081a63);
  box-shadow:inset 0 3px 0 var(--gold2),inset 0 5px 0 #6b3d00}
.gh{position:absolute;left:0;right:0;top:5px;height:34px;display:flex;background:#061049}
.gh .gc0{width:150px;flex:none;font-size:22px;font-weight:800;color:var(--gold);padding:5px 10px}
.gh .gs{flex:1;position:relative}
.gh .gs span{position:absolute;top:4px;font-size:23px;font-weight:800;color:var(--gold);padding-left:8px;border-left:2px solid rgba(255,210,58,.5);height:28px}
.grows{position:absolute;left:0;right:0;top:39px;bottom:0;overflow:hidden}
.gr{position:absolute;left:0;right:0;height:51px;display:flex;border-bottom:2px solid #061049}
.gr .gcn{width:150px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(180deg,#2c55c8,#173a9e);border-right:2px solid #061049}
.gr .gcn b{font-size:30px;font-weight:800;font-style:italic;color:var(--gold);min-width:38px;text-align:right}
.gr .gcn span{font-size:20px;font-weight:800;line-height:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gr .gp{flex:1;position:relative;overflow:hidden}
.cell{position:absolute;top:0;bottom:0;padding:0 7px;display:flex;align-items:center;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;
  background:linear-gradient(180deg,#2449b8 0%,#1a3a9a 55%,#122c80 100%);border-right:2px solid #061049;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.cell.now{background:linear-gradient(180deg,#2b56cf,#1b3da6)}
.cell.sel{background:linear-gradient(180deg,#fff1a0,#ffd23a 45%,#ffb000);color:#141000;text-shadow:none;transition:background .2s}
.cell .ar{color:var(--gold);margin-right:4px;flex:none}
/* long titles wrap onto two lines (smaller) so they fit inside their block */
.cell .ct{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.08}
.cell.two .ct{white-space:normal;font-size:18px;line-height:1.02;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:clip;word-break:break-word}
.cell.two.tiny .ct{font-size:16px}
#gInfo.long .gt{white-space:normal;font-size:25px;line-height:1.04;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#gInfo.long .gd{-webkit-line-clamp:2}
#gInfo .gimg{float:right;height:134px;width:238px;max-width:34%;object-fit:cover;border-radius:5px;margin:0 0 4px 12px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
/* hover a show for a moment (mouse only) to see what it's about */
#gTip{position:absolute;z-index:8;width:310px;padding:10px 12px 11px;border-radius:7px;display:none;pointer-events:none;color:#fff;text-shadow:1px 1px 0 #000;
  background:rgba(6,14,60,.97);box-shadow:inset 0 0 0 2px var(--edge),inset 0 0 0 4px var(--navy),5px 6px 0 rgba(0,0,0,.55)}
#gTip.on{display:block;animation:tipIn .18s ease-out both}
@keyframes tipIn{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
#gTip img{display:block;width:100%;height:160px;object-fit:cover;border-radius:4px;margin-bottom:8px;background:#000}
#gTip .tt{font-size:22px;font-weight:800;line-height:1.05}
#gTip .tm{font-size:16px;font-weight:700;color:var(--gold);margin:3px 0 5px}
#gTip .td{font-size:17px;font-weight:600;line-height:1.18;color:#e4ebff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.cell.sel .ar{color:#5a3b00}
.gr.cur .gcn{background:linear-gradient(180deg,#e3261b,#a0140c)}
.gr.cur .gcn b{color:#fff}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.45);z-index:2;pointer-events:none}
.cell .pr{display:none!important}
.gfoot{position:absolute;left:0;right:0;bottom:0;height:0}

#msg{position:absolute;left:40px;right:40px;top:150px;padding:20px 24px;border-radius:7px;display:none;text-align:center;font-size:30px;font-weight:800;line-height:1.2;
  background:linear-gradient(180deg,var(--panel-top),var(--panel-bot));box-shadow:inset 0 0 0 3px var(--edge),4px 5px 0 rgba(0,0,0,.55)}
#msg small{display:block;font-size:22px;font-weight:700;color:var(--ice);margin-top:8px}

/* ---- TV-box mode (lite): no glow blurs, no sweeping shines, fewer layers ---- */
.lite *{will-change:auto!important}
.lite .crawl{will-change:transform!important}
.lite .sh{text-shadow:2px 2px 0 #000!important}
.lite #panel:after,.lite .panel:after,.lite .logo:after{display:none!important;animation:none!important}
.lite #gCur{animation:none;box-shadow:0 0 0 3px #fff}
.lite .gnow{box-shadow:none}
.lite #gLogo .gl2{filter:none;-webkit-text-fill-color:var(--gold);background:none;text-shadow:2px 2px 0 #000}
.lite #guide.on #gGrid{animation-duration:.3s}

/* phones: lock the page in place (no pinch zoom, no pull-to-refresh, no bouncing) */
html,body{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#safe{position:fixed;top:0;right:0;bottom:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#pbar{position:fixed;left:50%;bottom:4%;transform:translate(-50%,20px);z-index:60;display:flex;gap:8px;padding:8px;border-radius:12px;background:rgba(6,14,60,.88);box-shadow:0 0 0 2px rgba(156,184,255,.6),0 6px 20px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#pbar.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#pbar button{font:800 22px "Barlow Condensed",Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#3a63d6,#1d3a9e);border:0;border-radius:8px;padding:10px 16px;min-width:74px;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#pbar button:hover,#pbar button:focus{background:linear-gradient(180deg,#fff1a0,#ffd23a 45%,#ffb000);color:#1a1300;outline:0}
</style>

  b.textContent=("key: "+e.key+"   code: "+(e.keyCode||e.which)+"   -> "+(k||"(not used)")+"\n")+(b.textContent.split("\n").slice(0,7).join("\n"))}
/* on-screen remote: for TV browsers where the remote moves a pointer instead of sending buttons */
(function(){var bar=document.createElement("div");bar.id="pbar";
  bar.innerHTML='<button data-k="up" title="Channel up">CH ▲</button><button data-k="down" title="Channel down">CH ▼</button><button data-k="ok">OK</button><button data-k="guide">GUIDE</button><button data-k="info">INFO</button><button data-k="left" title="Last channel">LAST</button><button data-k="back">BACK</button>';
  document.body.appendChild(bar);var hideT=0,lastX=-1,lastY=-1;
  var root=document.documentElement;
  function show(){bar.classList.add("on");root.classList.add("mouse");clearTimeout(hideT);hideT=setTimeout(function(){bar.classList.remove("on");root.classList.remove("mouse")},5000)}
  /* only a real mouse or TV pointer, not the fake mouse moves phones make after a tap */
  var moved=function(e){if(e.pointerType&&e.pointerType!=="mouse")return;if(Math.abs(e.clientX-lastX)+Math.abs(e.clientY-lastY)<6)return;lastX=e.clientX;lastY=e.clientY;show()};
  if(window.PointerEvent)addEventListener("pointermove",moved);else addEventListener("mousemove",moved);
  bar.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;e.stopPropagation();e.preventDefault();show();handleKey(b.dataset.k,e)});
  bar.addEventListener("mousedown",function(e){e.preventDefault()})})();
/* mouse wheel / trackpad: scroll down = Down, scroll up = Up (moves the guide, or changes channel while watching) */
var onWheel=(function(){var acc=0,last=0,lastEv=0;
  return function(e){if(e.ctrlKey)return;var d=e.deltaY*(e.deltaMode===1?40:e.deltaMode===2?400:1);
    if(Math.abs(d)<Math.abs(e.deltaX||0))return;if(e.cancelable)e.preventDefault();
    var t=Date.now(),g=$("guide").classList.contains("on");if(t-lastEv>300)acc=0;lastEv=t;acc+=d;
    if(Math.abs(acc)<50||t-last<(g?110:650))return;var k=acc>0?"down":"up";acc=0;last=t;handleKey(k)}})();
addEventListener("wheel",onWheel,{passive:false});
function handleKey(k,e){e=e||{preventDefault:function(){}};
  if(needSound){video.muted=false;needSound=false;$("hint").style.display="none"}
  unlockAudio();
  if($("guide").classList.contains("on")){e.preventDefault();
    if(k==="up")guideMove(-1,0);else if(k==="down")guideMove(1,0);else if(k==="left")guideMove(0,-1);else if(k==="right")guideMove(0,1);
    else if(k==="ok"){var r=G.row;closeGuide();if(r!==cur)tune(r,{now:true});else showBanner()}
    else if(k==="back"||k==="guide")closeGuide();return}
  if(k==="back"){if($("banner").classList.contains("on")){e.preventDefault();hideBanner()}return}
  e.preventDefault();
  if(k==="down")tune(cur+1);else if(k==="up")tune(cur-1);
  else if(k==="left"){if(prev>=0&&prev<CH.length)tune(prev,{now:true})}
  else if(k==="right"||k==="info")showBanner();
  else if(k==="ok"||k==="guide")openGuide();
  else if(k[0]==="d")digit(k[1])}

/* ---------- game controller (Xbox One / Series in Edge, or any gamepad) ----------
   D-pad: same as the remote arrows.  A = OK (guide)  B = back  Y = guide  X = info
   LB / RB = previous / next channel.  Left stick works like the D-pad. */
var PAD={12:"up",13:"down",14:"left",15:"right",0:"ok",1:"back",2:"info",3:"guide",4:"up",5:"down"};
var padState={},padSeen=false,padRAF=0,lastPadPress=0;
function padLoop(){var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
  for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
  if(gp){var t=Date.now(),pressed={};
    for(var b in PAD){var btn=gp.buttons[b];if(btn&&(btn.pressed||btn.value>.5))pressed[PAD[b]+":"+b]=PAD[b]}
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0;
    if(ay<-.6)pressed["up:s"]="up";if(ay>.6)pressed["down:s"]="down";if(ax<-.6)pressed["left:s"]="left";if(ax>.6)pressed["right:s"]="right";
    for(var id in pressed){var st=padState[id],k=pressed[id],repeat=$("guide").classList.contains("on")&&/up|down|left|right/.test(k);
      if(!st){padState[id]={t:t,next:t+450};padPress(k)}
      else if(repeat&&t>=st.next){st.next=t+140;padPress(k)}}
    for(var id2 in padState)if(!pressed[id2])delete padState[id2]}
  padRAF=requestAnimationFrame(padLoop)}
function padPress(k){lastPadPress=Date.now();if(!padSeen){padSeen=true;goFullscreen()}
  if(needSound){video.muted=false;needSound=false;$("hint").style.display="none"}unlockAudio();
  if(k==="back"){if($("guide").classList.contains("on"))closeGuide();else hideBanner();return}
  handleKey(k)}
function goFullscreen(){var d=document.documentElement;try{if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){})}catch(e){}}
/* Smart TV browsers (Samsung, LG, Sony/Android TV, Fire TV): go full screen the first time OK or a button is pressed */
if(window.self===window.top&&/Tizen|SMART-TV|SmartTV|Web0S|webOS|NetCast|BRAVIA|HbbTV|AFT|CrKey/i.test(navigator.userAgent)){
  var tvFs=function(){goFullscreen();var d=document.documentElement;if(!document.fullscreenElement&&d.webkitRequestFullscreen){try{d.webkitRequestFullscreen()}catch(e){}}};
  document.addEventListener("keydown",tvFs,{once:true,capture:true});document.addEventListener("click",tvFs,{once:true,capture:true})}
addEventListener("gamepadconnected",function(){cancelAnimationFrame(padRAF);padLoop()});
if(navigator.getGamepads)padLoop();
/* B on an Xbox controller is Edge's "back" button. Keep it from leaving the page: */
try{history.pushState({knas:1},"",location.href)}catch(e){}
addEventListener("popstate",function(){try{history.pushState({knas:1},"",location.href)}catch(e){}
  if(Date.now()-lastPadPress<400)return;
  if($("guide").classList.contains("on"))closeGuide();else hideBanner()});
addEventListener("click",function(){if(needSound){video.muted=false;needSound=false}});

/* ---------- touch: swipes and taps, no on-screen buttons ---------- */
function gestures(el,h){var sx=0,sy=0,lp=null,longDone=false,down=false,tapT=null;
  el.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"&&e.button!==0)return;down=true;sx=e.clientX;sy=e.clientY;longDone=false;
    clearTimeout(lp);lp=setTimeout(function(){lp=null;longDone=true;h.long&&h.long(e)},650)});
  el.addEventListener("pointermove",function(e){if(down&&Math.max(Math.abs(e.clientX-sx),Math.abs(e.clientY-sy))>12){clearTimeout(lp);lp=null}});
  el.addEventListener("pointercancel",function(){down=false;clearTimeout(lp)});
  el.addEventListener("pointerup",function(e){if(!down)return;down=false;clearTimeout(lp);if(longDone)return;if(Date.now()-lastPadPress<500)return;
    var dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy),touch=e.pointerType!=="mouse";
    if(touch)firstTouch();unlockAudio();if(needSound){video.muted=false;needSound=false;$("hint").style.display="none"}
    if(ax<15&&ay<15){var x=e.clientX,y=e.clientY;
      if(tapT){clearTimeout(tapT);tapT=null;h.dbl&&h.dbl(x,y);return}
      tapT=setTimeout(function(){tapT=null;h.tap&&h.tap(x,y)},280);return}
    if(Math.max(ax,ay)<40)return;
    if(ay>ax)(dy<0?h.up:h.down)&&(dy<0?h.up:h.down)();else (dx<0?h.left:h.right)&&(dx<0?h.left:h.right)()})}
var touched=false;
function firstTouch(){if(touched)return;touched=true;if(typeof seenHelp!=="undefined"&&seenHelp)return;showHint("SWIPE ↑ NEXT  ↓ BACK   TAP INFO   DOUBLE-TAP GUIDE")}
gestures($("touch"),{
  up:function(){tune(cur+1)}, down:function(){tune(cur-1)},
  right:function(){if(prev>=0&&prev<CH.length)tune(prev,{now:true})},
  left:function(){showBanner()},
  tap:function(){
    var ch=CH[cur];
    if(IOS&&!APP){   // iPhone in Safari: open the show in the iPhone player (turn the phone sideways for full screen)
      if(ch&&!ch.web&&video.webkitEnterFullscreen&&video.readyState>0){try{video.webkitEnterFullscreen();return}catch(e){}}
      if(ch&&ch.web&&!LS.get("knas_a2hs")){LS.set("knas_a2hs","1");showHint("FULL SCREEN: TAP SHARE ⬆ THEN ADD TO HOME SCREEN");return}
    }
    if($("banner").classList.contains("on"))hideBanner();else showBanner()},
  dbl:function(){openGuide()}, long:function(){openGuide()}});
$("guide").style.pointerEvents="auto";
gestures($("guide"),{
  up:function(){guideMove(Math.min(3,CH.length-1-G.row)||0,0)}, down:function(){guideMove(-Math.min(3,G.row)||0,0)},
  left:function(){guideMove(0,1)}, right:function(){guideMove(0,-1)},
  tap:function(x,y){var el=document.elementFromPoint(x,y),cell=el&&el.closest?el.closest(".cell"):null,row=el&&el.closest?el.closest(".gr"):null;
    if(cell){var r=+cell.dataset.row,t=+cell.dataset.t;
      if(r===G.row&&cell.classList.contains("sel")){closeGuide();if(r!==cur)tune(r,{now:true});else showBanner();return}
      G.row=r;G.t=Math.max(t,now());renderGuide();bumpIdle();return}
    if(row){return}
    var gg=$("gGrid").getBoundingClientRect();if(y<gg.top)closeGuide()},
  dbl:function(){var r=G.row;closeGuide();if(r!==cur)tune(r,{now:true})}});

/* ---------- clock tick ---------- */
setInterval(function(){if($("guide").classList.contains("on"))renderGuide()},30000);

/* ---------- boot ---------- */
if(window.KNASAudio){KNASAudio.attach(video,"tv");KNASAudio.attach(music,"music");KNASAudio.attach(sradio,"radio")}
video.addEventListener("webkitendfullscreen",function(){setTimeout(function(){video.play().catch(function(){})},250)});
var seenHelp=false;try{seenHelp=localStorage.getItem("knasHelp")==="1";localStorage.setItem("knasHelp","1")}catch(e){}
showStatic();
loadTV().then(function(){pollSportsRadio();
  if(!CH.length){showMsg(TVERR||"No channels found.","Check ERSATZTV_URL in settings.txt, then reload.");return}
  if(TVERR&&CH.length===1)showHint("ErsatzTV not reachable - only KNAS 42 available");
  var want=Q.get("ch")||LS.get("knas_ch"),i=CH.findIndex(function(c){return c.number===want});
  tune(i>=0?i:0,{now:true});
if(!seenHelp)setTimeout(function(){if(!touched)showHint(("ontouchstart" in window)?"SWIPE ↑ NEXT  ↓ BACK   TAP INFO   DOUBLE-TAP GUIDE":"▲▼ CHANNEL   OK GUIDE   ◀ LAST")},2500);
});
setInterval(loadTV,120000);
})();
</script>
